<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sgt-schwab — live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;600;700&family=Red+Hat+Text:wght@400;500;600&family=Red+Hat+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --carbon: #04040b;
      --graphite: #121113;
      --obsidian: #1a191b;
      --slate: #232225;
      --basalt: #2b292d;
      --iron: #323035;
      --pewter: #3c393f;
      --steel: #49474e;
      --fog: #7c7a85;
      --silver: #b5b2bc;
      --chalk: #e5e5e5;
      --ash: #eeeef0;
      --signal: #71d083;
      --led: #366740;
      --moss: #2d5736;
      --forest: #1d3a24;
      --fern: #1b2a1e;
      --link: #70b8ff;
      --lilac: #baa7ff;
      --plum: #291f43;
      --iris: #473876;
      --lavender: #e2ddfe;
      --loss: #e08b8b;
      --font-display: "Red Hat Display", Inter, sans-serif;
      --font-text: "Red Hat Text", Inter, sans-serif;
      --font-mono: "Red Hat Mono", ui-monospace, monospace;
      --r: 6px;
      --r-tag: 2px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--carbon); color: var(--ash); }
    body {
      font-family: var(--font-text);
      font-weight: 400;
      letter-spacing: 0.025em;
      line-height: 1.45;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }
    ::selection { background: var(--forest); color: var(--chalk); }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px 32px; }
    .masthead {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; flex-wrap: wrap;
      padding: 12px 0;
      background: var(--carbon);
      border-bottom: 1px solid var(--basalt);
    }
    .brand-row { display: flex; align-items: center; gap: 10px; }
    .led {
      width: 8px; height: 8px; border-radius: var(--r-tag);
      background: var(--steel);
    }
    .led.on {
      background: var(--signal);
      box-shadow: 0 0 10px rgba(113, 208, 131, 0.55);
    }
    .brand {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.025em;
      color: var(--chalk);
    }
    .brand span { font-weight: 500; color: var(--silver); }
    .nav, .status-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .asof {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--fog);
      letter-spacing: 0;
    }
    .badge {
      display: inline-flex; align-items: center;
      font-family: var(--font-mono); font-size: 10px; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.08em;
      padding: 4px 8px; border-radius: var(--r-tag);
      border: 1px solid var(--basalt); color: var(--silver);
      background: var(--obsidian); text-decoration: none;
    }
    .badge.here {
      color: var(--signal); border-color: var(--moss); background: var(--forest);
    }
    .badge.on {
      color: var(--signal); border-color: var(--moss); background: var(--fern);
    }
    .badge.attn {
      color: var(--lavender); border-color: var(--iris); background: var(--plum);
    }
    .badge.bad { color: var(--loss); border-color: #5a3030; background: #2a1515; }
    a.badge { cursor: pointer; }
    a.badge:hover, a.badge:focus-visible { filter: brightness(1.35); }
    button {
      font-family: var(--font-text); font-weight: 600; font-size: 13px;
      letter-spacing: 0.025em;
      background: var(--signal); color: var(--carbon);
      border: 1px solid var(--signal);
      padding: 6px 12px; border-radius: var(--r); cursor: pointer;
    }
    button.ghost {
      background: transparent; color: var(--silver); border-color: var(--basalt);
    }
    button.ghost:hover { color: var(--chalk); border-color: var(--steel); }
    :focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
    .strip {
      display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
      background: var(--graphite);
      border: 1px solid var(--basalt);
      border-radius: var(--r);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
      margin-top: 16px; overflow: hidden;
    }
    .kpi {
      padding: 12px 16px;
      border-right: 1px solid var(--basalt);
      min-width: 0;
    }
    .kpi:last-child { border-right: none; }
    .k-label {
      font-family: var(--font-mono); font-size: 10px; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.12em; color: var(--fog);
      margin-bottom: 4px;
    }
    .k-value {
      font-family: var(--font-mono); font-size: 22px; font-weight: 500;
      letter-spacing: 0; color: var(--chalk);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .k-value.up { color: var(--signal); }
    .k-value.down { color: var(--loss); }
    .desk {
      display: grid;
      grid-template-columns: 1.7fr 1fr;
      gap: 1px;
      background: var(--basalt);
      border: 1px solid var(--basalt);
      border-radius: var(--r);
      overflow: hidden;
      margin-top: 12px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .desk > section {
      background: var(--graphite);
      padding: 14px 16px;
      min-width: 0;
    }
    h2 {
      font-family: var(--font-mono); font-size: 10px; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.14em; color: var(--silver);
      margin: 0 0 10px;
    }
    .note, .sub {
      font-family: var(--font-mono); font-size: 11px; font-weight: 400;
      text-transform: none; letter-spacing: 0; color: var(--fog);
    }
    .note { margin-left: 8px; }
    .sub { margin: 0 0 8px; }
    table { width: 100%; border-collapse: collapse; }
    th {
      font-family: var(--font-mono); font-size: 10px; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.1em; color: var(--fog);
      text-align: left; padding: 6px 8px;
      border-bottom: 1px solid var(--basalt);
    }
    td {
      font-size: 12px; padding: 6px 8px;
      border-bottom: 1px solid var(--slate); color: var(--ash);
      letter-spacing: 0;
    }
    td.mono, .num {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }
    #book-table th:nth-child(n+2), #book-table td:nth-child(n+2),
    #swing-table th:nth-child(n+3), #swing-table td:nth-child(n+3),
    #orders-table th:nth-child(2), #orders-table td:nth-child(2),
    #orders-table th:nth-child(5), #orders-table td:nth-child(5) { text-align: right; }
    tbody tr:last-child td { border-bottom: none; }
    tr.clickable { cursor: pointer; }
    tr.clickable:hover td { background: var(--obsidian); }
    .ok { color: var(--signal); }
    .err { color: var(--loss); }
    .muted { color: var(--fog); }
    .scan {
      display: flex; flex-wrap: wrap; gap: 6px;
    }
    .chip {
      font-family: var(--font-mono); font-size: 11px; letter-spacing: 0;
      border: 1px solid var(--basalt); border-radius: var(--r-tag);
      padding: 4px 8px; color: var(--ash); background: var(--obsidian);
    }
    .chip.up { color: var(--signal); border-color: var(--moss); }
    .chip.down { color: var(--loss); }
    #tape-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    #tape-summary { margin: 0; font-size: 13px; color: var(--silver); max-width: 62ch; }
    #orders-panel {
      margin-top: 12px;
      background: var(--graphite);
      border: 1px solid var(--basalt);
      border-radius: var(--r);
      padding: 14px 16px;
    }
    .overlay {
      position: fixed; inset: 0; background: rgba(4,4,11,0.78);
      display: none; align-items: center; justify-content: center; z-index: 50;
    }
    .overlay.open { display: flex; }
    .modal {
      background: var(--graphite); border: 1px solid var(--basalt);
      border-radius: var(--r); padding: 16px; width: 660px;
      max-width: calc(100vw - 32px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .modal-title {
      font-family: var(--font-display); font-size: 18px; font-weight: 600;
      letter-spacing: -0.025em; color: var(--chalk);
    }
    .modal-sub { font-family: var(--font-mono); font-size: 11px; color: var(--fog); margin-left: 10px; }
    .toggle { display: inline-flex; border: 1px solid var(--basalt); border-radius: var(--r); overflow: hidden; margin-right: 8px; }
    .toggle button {
      background: var(--obsidian); color: var(--silver); border: none;
      border-radius: 0; padding: 5px 12px; font-size: 11px;
      font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em;
    }
    .toggle button.active { background: var(--forest); color: var(--signal); }
    .close-x { background: none; border: none; color: var(--fog); padding: 4px 8px; font-size: 18px; }
    .close-x:hover { color: var(--chalk); background: none; border-color: transparent; }
    @media (max-width: 900px) {
      .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .kpi:nth-child(odd) { border-right: 1px solid var(--basalt); }
      .kpi:nth-child(2n) { border-right: none; }
      .kpi { border-bottom: 1px solid var(--basalt); }
      .kpi:nth-last-child(-n+1) { border-bottom: none; }
      .desk { grid-template-columns: 1fr; }
      .k-value { font-size: 18px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
      .led.on { box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="masthead">
      <div class="brand-row">
        <span class="led" id="led" aria-hidden="true"></span>
        <span class="brand">sgt-<span>schwab</span></span>
        <nav class="nav" aria-label="Pages">
          <a href="/sgt/" class="badge here">Live</a>
        </nav>
      </div>
      <div class="status-row">
        <span id="hdr-trading" class="badge">—</span>
        <span id="hdr-orb" class="badge">ORB money —</span>
        <a id="token" class="badge" href="/schwab/oauth/start" title="Re-authorize Schwab — starts the refresh-token renewal login">—</a>
        <span id="auth" class="badge">—</span>
        <span id="asof" class="asof"></span>
        <button id="oauth-btn" hidden>Authorize Schwab</button>
      </div>
    </header>

    <div class="strip" aria-label="Account">
      <div class="kpi"><div class="k-label">Equity</div><div class="k-value" id="k-eq">—</div></div>
      <div class="kpi"><div class="k-label">Day</div><div class="k-value" id="k-day">—</div></div>
      <div class="kpi"><div class="k-label">Cash</div><div class="k-value" id="k-cash">—</div></div>
      <div class="kpi"><div class="k-label">Lots</div><div class="k-value" id="k-lots">—</div></div>
      <div class="kpi"><div class="k-label">Deployed</div><div class="k-value" id="k-deployed">—</div></div>
    </div>

    <div class="desk">
      <section>
        <h2>Broker book <span class="note" id="book-meta"></span></h2>
        <table id="book-table">
          <thead><tr>
            <th>Symbol</th><th>Qty</th><th>Avg</th><th>Now</th><th>Value</th><th>Day</th><th>P&amp;L</th><th>Stop</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </section>
      <section>
        <h2>Last swing <span class="note" id="ops-meta"></span></h2>
        <p id="ops-summary" class="sub"></p>
        <table id="swing-table">
          <thead><tr>
            <th>Side</th><th>Symbol</th><th>Qty</th><th>Price</th><th>Reason</th><th>Status</th>
          </tr></thead>
          <tbody></tbody>
        </table>
        <p id="ops-flatten" class="sub" style="margin-top:10px"></p>
      </section>
      <section>
        <h2>Scanner</h2>
        <div id="scanner" class="scan"></div>
      </section>
      <section>
        <h2>Tape <span class="note" id="edu-meta"></span></h2>
        <div id="tape">
          <div id="tape-tags"></div>
          <p id="tape-summary"></p>
        </div>
      </section>
    </div>

    <section id="orders-panel" hidden>
      <h2>Open orders</h2>
      <table id="orders-table">
        <thead><tr>
          <th>Symbol</th><th>Qty</th><th>Type</th><th>Status</th><th>Filled</th><th>Submitted</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </div>

  <div id="overlay" class="overlay">
    <div class="modal">
      <div class="modal-head">
        <div>
          <span id="m-title" class="modal-title"></span>
          <span id="m-sub" class="modal-sub"></span>
        </div>
        <div>
          <span class="toggle">
            <button id="t-line" class="active">Line</button>
            <button id="t-candles">Candles</button>
          </span>
          <button id="m-close" class="close-x ghost">&times;</button>
        </div>
      </div>
      <div id="m-chart"></div>
    </div>
  </div>

<script>
const SVGNS = 'http://www.w3.org/2000/svg';
function svgEl(name, attrs) {
  const el = document.createElementNS(SVGNS, name);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}
function setText(id, value) {
  document.getElementById(id).textContent = value;
}
function setKpi(id, value, dir) {
  const el = document.getElementById(id);
  el.textContent = value;
  el.className = 'k-value' + (dir === 'up' ? ' up' : dir === 'down' ? ' down' : '');
}
function money(n, signed) {
  if (n == null || !isFinite(Number(n))) return '—';
  const v = Number(n);
  const s = '$' + Math.abs(v).toFixed(2);
  if (!signed) return (v < 0 ? '−' : '') + s;
  if (v > 0) return '+' + s;
  if (v < 0) return '−' + s;
  return s;
}
function qtyStr(q) {
  const n = Number(q);
  if (!isFinite(n)) return '—';
  return n.toFixed(4).replace(/0+$/, '').replace(/\.$/, '');
}
function badgeClass(el, kind) {
  el.className = 'badge' + (kind ? ' ' + kind : '');
}

function makeCell(c) {
  const td = document.createElement('td');
  if (c.node) td.appendChild(c.node);
  else td.textContent = c.text;
  if (c.cls) td.className = c.cls;
  return td;
}
function renderTable(tbodySelector, rows) {
  const tbody = document.querySelector(tbodySelector);
  while (tbody.firstChild) tbody.removeChild(tbody.firstChild);
  for (const row of rows) {
    const cells = row.cells || row;
    const tr = document.createElement('tr');
    for (const c of cells) tr.appendChild(makeCell(c));
    if (row.onClick) {
      tr.className = 'clickable';
      tr.addEventListener('click', row.onClick);
    }
    tbody.appendChild(tr);
  }
}


let mSymbol = null, mData = null, mTimer = null;
let mMode = localStorage.getItem('chartMode') || 'line';

function chartScales(d, W, H) {
  const bars = d.bars || [];
  const m = {l: 48, r: 12, t: 12, b: 18};
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  let lo = Infinity, hi = -Infinity;
  for (const b of bars) { lo = Math.min(lo, b.l); hi = Math.max(hi, b.h); }
  if (d.or_high != null) hi = Math.max(hi, d.or_high);
  if (d.or_low != null) lo = Math.min(lo, d.or_low);
  if (!isFinite(lo)) { lo = 0; hi = 1; }
  const span = (hi - lo) || 1, n = bars.length;
  return {bars, m, iw, ih, lo, hi, n,
    x: i => m.l + (n <= 1 ? iw / 2 : i * iw / (n - 1)),
    y: v => m.t + (hi - v) * ih / span};
}
function axisAndOR(svg, s, d) {
  [s.lo, (s.lo + s.hi) / 2, s.hi].forEach(function (v) {
    svg.appendChild(svgEl('line', {x1: s.m.l, x2: s.m.l + s.iw, y1: s.y(v), y2: s.y(v),
        stroke: '#2b292d', 'stroke-width': 0.5}));
    const t = svgEl('text', {x: 4, y: s.y(v) + 3, fill: '#7c7a85', 'font-size': 10});
    t.textContent = '$' + v.toFixed(2);
    svg.appendChild(t);
  });
  function orLine(v, color, label, dy) {
    svg.appendChild(svgEl('line', {x1: s.m.l, x2: s.m.l + s.iw, y1: s.y(v), y2: s.y(v),
        stroke: color, 'stroke-width': 1, 'stroke-dasharray': '4 3'}));
    const t = svgEl('text', {x: s.m.l + s.iw - 2, y: s.y(v) + dy, fill: color,
        'font-size': 10, 'text-anchor': 'end'});
    t.textContent = label;
    svg.appendChild(t);
  }
  if (d.or_high != null) orLine(d.or_high, '#baa7ff', 'OR high', -3);
  if (d.or_low != null) orLine(d.or_low, '#7c7a85', 'OR low', 11);
}
function lineChart(d) {
  const W = 600, H = 300;
  const svg = svgEl('svg', {width: W, height: H, viewBox: '0 0 ' + W + ' ' + H});
  const s = chartScales(d, W, H);
  axisAndOR(svg, s, d);
  if (s.n >= 2) {
    const up = s.bars[s.n - 1].c >= s.bars[0].c;
    svg.appendChild(svgEl('polyline', {points: s.bars.map((b, i) => s.x(i) + ',' + s.y(b.c)).join(' '),
        fill: 'none', stroke: up ? '#71d083' : '#e08b8b', 'stroke-width': 1.5}));
    const last = s.bars[s.n - 1];
    svg.appendChild(svgEl('circle', {cx: s.x(s.n - 1), cy: s.y(last.c), r: 3, fill: up ? '#71d083' : '#e08b8b'}));
  } else {
    const t = svgEl('text', {x: W / 2, y: H / 2, fill: '#7c7a85', 'font-size': 12, 'text-anchor': 'middle'});
    t.textContent = 'no bars buffered yet';
    svg.appendChild(t);
  }
  return svg;
}
function candleChart(d) {
  const W = 600, H = 300, volH = 46;
  const svg = svgEl('svg', {width: W, height: H, viewBox: '0 0 ' + W + ' ' + H});
  const s = chartScales(d, W, H - volH);
  axisAndOR(svg, s, d);
  const n = s.n, bw = Math.max(2, (s.iw / Math.max(n, 1)) * 0.6);
  const xc = i => s.m.l + (i + 0.5) * s.iw / Math.max(n, 1);
  let maxV = 0;
  for (const b of s.bars) maxV = Math.max(maxV, b.v || 0);
  maxV = maxV || 1;
  const vy = v => H - (v / maxV) * (volH - 4);
  for (let i = 0; i < n; i++) {
    const b = s.bars[i], up = b.c >= b.o, col = up ? '#71d083' : '#e08b8b';
    svg.appendChild(svgEl('line', {x1: xc(i), x2: xc(i), y1: s.y(b.h), y2: s.y(b.l), stroke: col, 'stroke-width': 1}));
    const top = Math.min(s.y(b.o), s.y(b.c)), hgt = Math.max(1, Math.abs(s.y(b.c) - s.y(b.o)));
    svg.appendChild(svgEl('rect', {x: xc(i) - bw / 2, y: top, width: bw, height: hgt, fill: col}));
    svg.appendChild(svgEl('rect', {x: xc(i) - bw / 2, y: vy(b.v || 0), width: bw, height: H - vy(b.v || 0),
        fill: col, opacity: 0.5}));
  }
  svg.appendChild(svgEl('line', {x1: s.m.l, x2: s.m.l + s.iw, y1: H - volH, y2: H - volH,
      stroke: '#2b292d', 'stroke-width': 0.5}));
  if (n === 0) {
    const t = svgEl('text', {x: W / 2, y: H / 2, fill: '#7c7a85', 'font-size': 12, 'text-anchor': 'middle'});
    t.textContent = 'no bars buffered yet';
    svg.appendChild(t);
  }
  return svg;
}
function drawDetail() {
  if (!mData) return;
  const host = document.getElementById('m-chart');
  while (host.firstChild) host.removeChild(host.firstChild);
  host.appendChild(mMode === 'candles' ? candleChart(mData) : lineChart(mData));
}
function setMode(mode) {
  mMode = mode;
  localStorage.setItem('chartMode', mode);
  document.getElementById('t-line').className = mode === 'line' ? 'active' : '';
  document.getElementById('t-candles').className = mode === 'candles' ? 'active' : '';
  drawDetail();
}
async function loadDetail() {
  if (!mSymbol) return;
  mData = await (await fetch('/sgt/api/bars?symbol=' + encodeURIComponent(mSymbol))).json();
  document.getElementById('m-title').textContent = mSymbol;
  const band = (mData.or_low != null ? '$' + mData.or_low.toFixed(2) : '-')
             + ' – ' + (mData.or_high != null ? '$' + mData.or_high.toFixed(2) : '-');
  document.getElementById('m-sub').textContent = 'OR ' + band
    + (mData.current != null ? '  ·  cur $' + mData.current.toFixed(2) : '')
    + (mData.fired ? '  ·  BREAKOUT' : '');
  drawDetail();
}
async function openModal(sym) {
  mSymbol = sym;
  document.getElementById('overlay').classList.add('open');
  setMode(mMode);
  await loadDetail();
  if (mTimer) clearInterval(mTimer);
  mTimer = setInterval(loadDetail, 2000);
}
function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  mSymbol = null;
  if (mTimer) { clearInterval(mTimer); mTimer = null; }
}

function jsonOr(url, fallback) {
  return fetch(url).then(function (r) { return r.json(); }).catch(function () { return fallback; });
}

let refreshing = false;
async function refresh() {
  if (refreshing) return;
  refreshing = true;
  try {
  const status = await jsonOr('/sgt/api/status', {});
  const running = status.mode === 'running';
  document.getElementById('led').className = 'led' + (running ? ' on' : '');
  const authEl = document.getElementById('auth');
  const authLabel = status.mode === 'error' ? 'token error'
                  : status.mode === 'setup' ? 'unauthenticated'
                  : running ? 'authenticated' : (status.mode || 'unknown');
  authEl.textContent = authLabel;
  badgeClass(authEl, running ? 'on' : 'bad');
  document.getElementById('oauth-btn').hidden = running;

  const tm = status.trading_mode || '—';
  const hdrTm = document.getElementById('hdr-trading');
  hdrTm.textContent = tm === 'dry_run' ? 'dry run' : (tm === 'live' ? 'trading live' : tm);
  badgeClass(hdrTm, tm === 'live' ? 'attn' : (tm === 'dry_run' ? 'on' : ''));
  const orbLive = !!status.enable_orb_live;
  const hdrOrb = document.getElementById('hdr-orb');
  hdrOrb.textContent = orbLive ? 'ORB money ON' : 'ORB money OFF';
  badgeClass(hdrOrb, orbLive ? 'bad' : 'on');

  const tk = status.token;
  const tokenEl = document.getElementById('token');
  if (tk && tk.expires_at) {
    if (tk.expired) {
      tokenEl.textContent = 'token expired';
      badgeClass(tokenEl, 'bad');
    } else {
      const d = tk.days_remaining;
      tokenEl.textContent = d.toFixed(1) + 'd token';
      badgeClass(tokenEl, d <= 2 ? 'attn' : 'on');
    }
  } else {
    tokenEl.textContent = 'token —';
    badgeClass(tokenEl, '');
  }

  const a = status.account || {};
  const raw = a._raw_positions || [];
  let posValue = 0, dayPnl = 0;
  const held = {};
  const posList = [];
  raw.forEach(function (p) {
    const inst = p.instrument || {};
    const qty = (p.longQuantity || 0) - (p.shortQuantity || 0);
    if (!qty) return;
    const value = p.marketValue || 0;
    const now = qty ? value / qty : 0;
    const pnl = p.longOpenProfitLoss || 0;
    const day = p.currentDayProfitLoss || 0;
    const dayPct = p.currentDayProfitLossPercentage;
    posValue += value;
    dayPnl += day;
    const sym = inst.symbol || '';
    held[sym] = true;
    posList.push({sym: sym, qty: qty, avg: p.averagePrice || p.averageLongPrice || 0,
                  now: now, value: value, pnl: pnl, day: day, dayPct: dayPct});
  });
  posList.sort(function (a, b) { return b.value - a.value; });

  setKpi('k-eq', money(a.equity));
  setKpi('k-day', money(dayPnl, true), dayPnl > 0 ? 'up' : (dayPnl < 0 ? 'down' : ''));
  setKpi('k-cash', money(a.cash), a.cash < 0 ? 'down' : '');
  setKpi('k-lots', posList.length ? String(posList.length) : '0');
  const eq = a.equity || 0;
  const pct = eq > 0 ? (posValue / eq * 100) : 0;
  setKpi('k-deployed', posList.length ? (pct.toFixed(0) + '%') : '—');

  const now = new Date();
  setText('asof', now.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', second: '2-digit'}));

  const [edu, ops, orders, scan] = await Promise.all([
    jsonOr('/sgt/api/education', {exists: false}),
    jsonOr('/sgt/api/ops', {}),
    jsonOr('/sgt/api/orders', []),
    jsonOr('/sgt/api/scanner', []),
  ]);

  const live = ops.last_live_swing;
  const uni = ops.universe || {};
  const stops = {};
  if (live) {
    (live.plan || []).forEach(function (o) {
      if (o.symbol && o.stop_price != null) stops[o.symbol] = o.stop_price;
    });
    const kind = live.preview ? 'preview' : 'live';
    setText('ops-meta', (live.date || '') + ' · ' + kind + ' · universe ' + (uni.n || 0));
    document.getElementById('ops-summary').textContent =
      (live.regime || '') + ' · equity ' + money(live.equity) + ' · cash ' + money(live.cash);
    const byStatus = {};
    (live.results || []).forEach(function (r) { byStatus[r.symbol] = r.status; });
    renderTable('#swing-table tbody', (live.plan || []).map(function (o) {
      const sym = o.symbol || '';
      const st = held[sym] ? 'held' : (byStatus[sym] || (live.preview ? 'preview' : '—'));
      return [
        {text: (o.action || '').toUpperCase()},
        {text: sym},
        {text: o.qty != null ? qtyStr(o.qty) : '—', cls: 'num'},
        {text: o.price != null ? money(o.price) : '—', cls: 'num'},
        {text: o.reason || ''},
        {text: st, cls: st === 'held' ? 'ok' : (st === 'submitted' ? 'muted' : '')},
      ];
    }));
  } else {
    setText('ops-meta', '');
    document.getElementById('ops-summary').textContent = 'No live_swing snapshot yet.';
    renderTable('#swing-table tbody', []);
  }
  const flat = ops.last_flatten;
  document.getElementById('ops-flatten').textContent =
    (flat && flat.plan && flat.plan.length)
      ? ('Last flatten: ' + flat.plan.length + ' sells' + (flat.preview ? ' (preview)' : ''))
      : '';

  if (posList.length) {
    setText('book-meta', posList.length + ' lots · ' + money(posValue) + ' · ' + pct.toFixed(0) + '% of equity');
    renderTable('#book-table tbody', posList.map(function (p) {
      const dayCls = p.day > 0 ? 'num ok' : (p.day < 0 ? 'num err' : 'num');
      const pnlCls = p.pnl > 0 ? 'num ok' : (p.pnl < 0 ? 'num err' : 'num');
      const dayTxt = p.dayPct != null
        ? money(p.day, true) + '  ' + (p.dayPct > 0 ? '+' : '') + Number(p.dayPct).toFixed(2) + '%'
        : money(p.day, true);
      return {
        cells: [
          {text: p.sym},
          {text: qtyStr(p.qty), cls: 'num'},
          {text: money(p.avg), cls: 'num'},
          {text: money(p.now), cls: 'num'},
          {text: money(p.value), cls: 'num'},
          {text: dayTxt, cls: dayCls},
          {text: money(p.pnl, true), cls: pnlCls},
          {text: stops[p.sym] != null ? money(stops[p.sym]) : '—', cls: 'num muted'},
        ],
        onClick: function () { openModal(p.sym); },
      };
    }));
  } else {
    setText('book-meta', 'broker flat');
    renderTable('#book-table tbody', [[{text: 'Broker flat', cls: 'muted'}]]);
  }

  if (edu && edu.exists) {
    const c = edu.condition || {};
    setText('edu-meta', (c.as_of || '') + (c.confidence ? ' · conf ' + c.confidence : ''));
    document.getElementById('tape-summary').textContent = c.summary || '';
    const tags = c.tags || [];
    document.getElementById('tape-tags').innerHTML = tags.map(function (t) {
      return '<span class="badge here">' + t + '</span>';
    }).join(' ');
  } else {
    setText('edu-meta', '');
    document.getElementById('tape-summary').textContent = 'No condition file yet.';
    document.getElementById('tape-tags').textContent = '';
  }

  const scanHost = document.getElementById('scanner');
  if (scan && scan.length) {
    scanHost.innerHTML = scan.map(function (s) {
      const pct = Number(s.change_pct || 0);
      const cls = pct >= 0 ? 'chip up' : 'chip down';
      const px = s.price != null ? ' $' + Number(s.price).toFixed(2) : '';
      const sign = pct >= 0 ? '+' : '';
      return '<span class="' + cls + '">' + (s.symbol || '') + ' ' + sign + pct.toFixed(1) + '%' + px + '</span>';
    }).join('');
  } else {
    scanHost.textContent = 'No names in filter.';
  }

  const panel = document.getElementById('orders-panel');
  if (orders && orders.length) {
    panel.hidden = false;
    renderTable('#orders-table tbody', orders.map(function (o) {
      const s = (o.status || '').toLowerCase();
      const cls = s === 'filled' ? 'ok'
                : (s.indexOf('reject') >= 0 || s.indexOf('cancel') >= 0 || s.indexOf('expired') >= 0) ? 'err'
                : 'muted';
      return [
        {text: o.symbol},
        {text: qtyStr(o.qty), cls: 'num'},
        {text: o.type || '-'},
        {text: o.status || '-', cls: cls},
        {text: String(o.filled_qty || 0), cls: 'num'},
        {text: (o.submitted_at || '').replace('T', ' ').slice(0, 16)},
      ];
    }));
  } else {
    panel.hidden = true;
  }
  } finally {
    refreshing = false;
  }
}

document.getElementById('oauth-btn').addEventListener('click', function () {
  window.location = '/schwab/oauth/start';
});
document.getElementById('t-line').addEventListener('click', function () { setMode('line'); });
document.getElementById('t-candles').addEventListener('click', function () { setMode('candles'); });
document.getElementById('m-close').addEventListener('click', closeModal);
document.getElementById('overlay').addEventListener('click', function (e) {
  if (e.target.id === 'overlay') closeModal();
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
