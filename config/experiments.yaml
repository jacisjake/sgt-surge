# Trading Lab experiment registry (git). Server overrides: state/experiments/overrides.yaml
version: 1
defaults:
  gates:
    min_closed_trades: 15
    max_drawdown: 0.20
    require_positive_expectancy: true

experiments:
  # Promoted to live only via scripts.lab.promote --to live (writes overrides)
  breakout_52w_live:
    strategy: breakout_52w
    params:
      lookback: 252
      ma_exit: 50
      stop_pct: 0.08
      risk_pct: 0.01
      regime_sma: 200
      use_regime_gate: true
      use_ma_exit: false
      k1: 2.0
      k2: 3.0
      atr_period: 14
      stop_min_pct: 0.04
      stop_max_pct: 0.15
      slip_bps: 15.0

    capital: 200.0
    mode: live
    stage: research
    symbols_file: state/universes/live.txt

    ledger_path: state/experiments/breakout_52w_live/ledger.json
    live_audit_path: state/experiments/breakout_52w_live/live_audit.json
    backtest_report_path: state/experiments/breakout_52w_live/backtest_report.json

  short_term_reversal_research:
    strategy: short_term_reversal
    params:
      down_days: 3
      hold: 5
      stop_pct: 0.05
      target_pct: 0.10
      ma: 200
      risk_pct: 0.01
      slip_bps: 15.0
    capital: 200.0
    mode: backtest
    stage: research
    symbols_file: state/breakout_universe.txt
    ledger_path: state/experiments/short_term_reversal_research/ledger.json
    backtest_report_path: state/experiments/short_term_reversal_research/backtest_report.json
