version: "3"

services:
  sgt-schwab:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: sgt-schwab-bot
    restart: always
    env_file:
      - ../.env
    environment:
      - TZ=America/New_York
    ports:
      - "8080:8080"
    volumes:
      - /opt/sgt-schwab/state:/app/state:Z
      - /opt/sgt-schwab/logs:/app/logs:Z
    healthcheck:
      # /api/status returns HTTP 200 in every state (setup / error / running),
      # so `curl -f` alone can't tell a dead Schwab token from a working bot.
      # Require the body to report mode:running — anything else (setup awaiting
      # OAuth, or error on an invalid/expired refresh token) marks it unhealthy.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/status | grep -qE '\"mode\"[[:space:]]*:[[:space:]]*\"running\"' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
