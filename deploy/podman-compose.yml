version: "3"

services:
  sgt-schwab:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: sgt-schwab-bot
    restart: always
    env_file:
      - ../.env
    environment:
      - TZ=America/New_York
    ports:
      - "8080:8080"
    volumes:
      - /opt/sgt-schwab/state:/app/state:Z
      - /opt/sgt-schwab/logs:/app/logs:Z
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/status || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
